# /etc/backend/nginx/backend-upstreams.conf - the platforms and gateways the front's nginx sends the
# API and the lobby to: every machine's, on its private address (D-82, docs/operations/05). The same
# file on every machine, since any may be the front. One that fails is passed over for 10 s
# (max_fails 1, fail_timeout 10s, nginx's defaults); a POST already sent is not sent to another.

upstream backend_gateway {
    # A lobby connection lasts the session: each new one to the gateway holding the fewest.
    least_conn;
    server 10.0.0.1:8090;
    server 10.0.0.2:8090;
    server 10.0.0.3:8090;
}

upstream backend_platform {
    server 10.0.0.1:8080;
    server 10.0.0.2:8080;
    server 10.0.0.3:8080;
    # Kept below the platform's 1 000-connection idle limit, and dropped before its 30 s idle
    # timeout. The other way round, the platform closed a connection nginx was about to reuse,
    # and nginx does not retry a POST on another one: a login would fail with 502.
    keepalive 32;
    keepalive_timeout 20s;
}
