# nginx in front of this machine's gateway and platform (docs/operations/01-deploy.md §4).
# Match traffic never comes through here (D-5): clients dial the arena directly.
#
# Every number below answers to one elsewhere; change them together:
#   gateway closes a silent lobby socket after 120 s   -> the lobby read timeout is longer
#   platform drops idle HTTP connections after 30 s    -> upstream keepalive_timeout is shorter
#   platform keeps at most 1 000 idle connections      -> the upstream keepalive pool is smaller
#   platform limits password attempts precisely        -> this is only a cheap outer flood guard
#
# a.example.com stands for this machine's one public name (§11): the lobby, the API and this
# machine's arenas are all reached by it, and its certificate names it. The domain is not
# chosen yet (S-6).
#
# Checked with `nginx -t` and run in front of the release with a test CA (nginx 1.24).

limit_req_zone $binary_remote_addr zone=backend_auth:10m rate=2r/s;
limit_req_status 429;
server_tokens off;

upstream backend_gateway {
    server 127.0.0.1:8090;
}

upstream backend_platform {
    server 127.0.0.1:8080;
    # Kept below the platform's 1 000-connection idle limit, and dropped before its 30 s idle
    # timeout. The other way round, the platform closed a connection nginx was about to reuse,
    # and nginx does not retry a POST on another one: a login would fail with 502.
    keepalive 32;
    keepalive_timeout 20s;
}

# Port 80 answers the CA's HTTP-01 challenge and refuses everything else. No redirect: a
# client that sent a login here has already sent the password in the clear, and one that
# followed a redirect would turn the POST into a GET. It should fail, loudly, in testing.
server {
    listen 80;
    listen [::]:80;
    server_name a.example.com;

    # certbot certonly --webroot -w /var/www/acme. Under /var/www because SELinux lets nginx
    # read there by default (httpd_sys_content_t), and not under /var/lib.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 403 "HTTPS only\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name a.example.com;

    # Installed by backend/scripts/install-certificate.sh, which checks both before nginx
    # sees them. The key is a secret, so it lives with the other credentials (§2).
    ssl_certificate     /etc/backend/tls/fullchain.pem;
    ssl_certificate_key /etc/backend/credentials/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 with forward secrecy and authenticated encryption only; 1.3 has nothing else.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:backend_tls:10m;
    ssl_session_timeout 1h;
    # nginx never rotates its ticket key, so a ticket would undo forward secrecy until the next
    # restart. Resumption still works from the cache above.
    ssl_session_tickets off;

    # A register or login body is a username, a display name and a password: the platform
    # reads at most 4 KiB, so nothing larger needs to reach it.
    client_max_body_size 4k;

    # The platform takes the last X-Forwarded-For entry from a peer on this machine, and only
    # that one: $proxy_add_x_forwarded_for appends $remote_addr, the address nginx saw.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    location = /lobby {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        # A location that sets any proxy_set_header inherits none from the server block, so
        # every header this location needs is set here, not only the two it adds.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # Longer than the gateway's own 120 s, so the gateway decides when a socket is dead.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location = /v1/sessions {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    location = /v1/accounts {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    # A guest made, and an upgrade, cost what a registration does (S-18). platform answers only
    # these exact paths, so a slash added is not a way past the limit.
    location = /v1/guests {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    location = /v1/accounts/upgrade {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    location /v1/ {
        include /etc/backend/nginx/backend-platform.conf;
    }

    # /health is for this machine's monitoring, over loopback, not for the internet.
    location / {
        return 404;
    }
}
