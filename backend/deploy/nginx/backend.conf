# nginx on the front, the machine the provider forwards the site's one public address to: the API
# and the lobby for the platforms and gateways of all three machines (D-82, docs/operations/05), on 443
# over TLS and on 80 in clear (D-115); and on 80, matches without TLS (/match/). Every machine runs it the
# same, so any can be the front. Match traffic over TLS is backend-stream.conf's, on 9001.
#
# Every number below answers to one elsewhere; change them together:
#   gateway closes a silent lobby socket after 120 s   -> the lobby read timeout is longer
#   platform drops idle HTTP connections after 30 s    -> upstream keepalive_timeout is shorter
#   platform keeps at most 1 000 idle connections      -> the upstream keepalive pool is smaller
#   platform limits guests per address precisely       -> this is only a cheap outer flood guard
#
# 203.0.113.10 stands for the site's public address: the site has no domain, and players reach it by that
# address, which the certificate names, from the backend's own CA (D-82, docs/operations/06).
#
# Run as written, with the release's nginx, by backend/scripts/check-ports-el9.sh (docs/operations/05 §9).

limit_req_zone $binary_remote_addr zone=backend_auth:10m rate=2r/s;
limit_req_status 429;
server_tokens off;

# The three machines' platforms and gateways, on their private addresses: the site's own.
include /etc/backend/nginx/backend-upstreams.conf;

# A match without TLS names its arena in its path, /match/<name>, the grant's tlsName (D-115): the name to
# the arena by the list 9001 uses. A name not there: none, and a 404.
map $backend_match_name $backend_match_arena {
    include /etc/backend/nginx/backend-arenas.conf;
    default "";
}

# 443 over TLS, and 80 in clear for a client without TLS (D-115): the same locations, limits and upstreams on
# both. What crosses 80 is readable by anyone on the way, passwords and tokens too; the owner's choice (Q-64).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10;

    # Installed by backend/scripts/install-certificate.sh, which checks both before nginx
    # sees them. The key is a secret, so it lives with the other credentials (§2).
    ssl_certificate     /etc/backend/tls/fullchain.pem;
    ssl_certificate_key /etc/backend/credentials/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 with forward secrecy and authenticated encryption only; 1.3 has nothing else.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:backend_tls:10m;
    ssl_session_timeout 1h;
    # nginx never rotates its ticket key, so a ticket would undo forward secrecy until the next
    # restart. Resumption still works from the cache above.
    ssl_session_tickets off;

    # A login body is an access token or a guest's key, under a kilobyte: the platform reads at
    # most 4 KiB, so nothing larger needs to reach it.
    client_max_body_size 4k;

    # The platform takes the last X-Forwarded-For entry from a peer on this machine, and only
    # that one: $proxy_add_x_forwarded_for appends $remote_addr, the address nginx saw.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    location = /lobby {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        # A location that sets any proxy_set_header inherits none from the server block, so
        # every header this location needs is set here, not only the two it adds.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # Longer than the gateway's own 120 s, so the gateway decides when a socket is dead.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location = /v1/sessions {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    location = /v1/accounts {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    # A guest made, and a guest linked to an account, open an account as a login does (S-18). platform
    # answers only these exact paths, so a slash added is not a way past the limit.
    location = /v1/guests {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    location = /v1/accounts/link {
        limit_req zone=backend_auth burst=30 nodelay;
        include /etc/backend/nginx/backend-platform.conf;
    }

    # The account service's events, which it posts to a platform on the private network (D-117): not the
    # internet's to send, signed or not.
    location = /v1/account-events {
        return 404;
    }

    location /v1/ {
        include /etc/backend/nginx/backend-platform.conf;
    }

    # A match without TLS (D-115): 9001 tells arenas apart by the name in the TLS handshake, which this client
    # has not got, so it asks for its arena by name, and nginx passes the connection on as it passes the lobby's
    # WebSocket: the arena answers 101, and the match's frames go both ways. Answered on 443 too, unused there.
    location ~ ^/match/(?<backend_match_name>[a-z0-9.-]+)$ {
        if ($backend_match_arena = "") {
            return 404;
        }
        proxy_pass http://$backend_match_arena;
        proxy_http_version 1.1;
        # The arena reads the request's line and these four, none of the phone's own headers: X-Forwarded-For
        # is the address nginx saw, as 9001's PROXY line gives it, never one the phone sent.
        proxy_pass_request_headers off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        # Longer than the arena's own 30 s without a frame, so the arena decides a connection is dead, as on 9001.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /health is for this machine's monitoring, over loopback, not for the internet.
    location / {
        return 404;
    }
}
