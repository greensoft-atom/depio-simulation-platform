# /etc/backend/nginx/backend-arenas.conf - the site's arenas by name (D-82, D-115): each one's
# BACKEND_ADVERTISE_TLS_NAME, and its machine's private address with its ARENA_PORT. nginx's two maps read
# this one list: 9001's, by the name in the TLS handshake (backend-stream.conf), and 80's, by the name a match
# without TLS asks for, /match/<name> (backend.conf). The same file on every machine, since any may be the front.
a1.arena.internal  10.0.0.1:9011;
a2.arena.internal  10.0.0.1:9012;
b1.arena.internal  10.0.0.2:9011;
b2.arena.internal  10.0.0.2:9012;
b3.arena.internal  10.0.0.2:9013;
c1.arena.internal  10.0.0.3:9011;
c2.arena.internal  10.0.0.3:9012;
