# /etc/backend/nginx/backend-platform.conf - the proxy settings every platform location shares.
proxy_pass http://backend_platform;
proxy_http_version 1.1;
proxy_set_header Connection "";                         # keep the upstream connection alive
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Host $host;
# A login waits for Argon2 and may queue behind 160 others (S-7): a client allows 10 s.
proxy_read_timeout 15s;
