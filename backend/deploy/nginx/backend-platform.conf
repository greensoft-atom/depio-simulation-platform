# /etc/backend/nginx/backend-platform.conf - the proxy settings every platform location shares.
proxy_pass http://backend_platform;
proxy_http_version 1.1;
proxy_set_header Connection "";                         # keep the upstream connection alive
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Host $host;
# Above the 10 s a client allows, so a slow answer is the client's to give up on, not cut here. The platform answers in
# seconds (its pool waits 3 s at most); the wait for Argon2 is the account service's since D-117, its location's 15 s.
proxy_read_timeout 15s;
