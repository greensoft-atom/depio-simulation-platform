# /etc/backend/nginx/backend-stream.conf - match traffic on 9001 (D-82, docs/operations/05). nginx ends the
# client's TLS with the site's certificate, which names every arena, and passes the connection, in plaintext
# on the private network, to the arena the handshake named (SNI). A name here is an arena's
# BACKEND_ADVERTISE_TLS_NAME, and its address the arena's machine's private one with its ARENA_PORT. The same
# file on every machine, since any may be the front.

log_format backend_stream '$remote_addr [$time_local] "$ssl_server_name" $upstream_addr '
                          '$status $bytes_sent $bytes_received $session_time';
access_log /var/log/backend-nginx/stream.log backend_stream;

map $ssl_server_name $backend_arena {
    a1.arena.internal  10.0.0.1:9011;
    a2.arena.internal  10.0.0.1:9012;
    b1.arena.internal  10.0.0.2:9011;
    b2.arena.internal  10.0.0.2:9012;
    b3.arena.internal  10.0.0.2:9013;
    c1.arena.internal  10.0.0.3:9011;
    c2.arena.internal  10.0.0.3:9012;
    # A name not here, or none: no arena, and nginx closes the connection.
    default            "";
}

server {
    listen 9001 ssl;
    listen [::]:9001 ssl;

    # The certificate the 443 server shows: one, from the backend's own CA, naming the public address
    # and every arena (docs/operations/06). Installed by scripts/install-certificate.sh.
    ssl_certificate     /etc/backend/tls/fullchain.pem;
    ssl_certificate_key /etc/backend/credentials/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:backend_stream_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    proxy_pass $backend_arena;
    proxy_connect_timeout 5s;
    # Longer than the arena's own 30 s without a frame, so the arena decides a connection is dead.
    proxy_timeout 60s;
}
