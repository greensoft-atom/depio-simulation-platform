# /etc/backend/nginx/nginx.conf - the main file of the release's nginx (/opt/backend/nginx, built for
# RHEL 9 by vendor/build-nginx.sh; docs/detailed-design/09 §5). The distribution's nginx brought
# its own; this one is ours. The server blocks are backend.conf, beside it.
#
# Run by backend-nginx.service as root, which binds 80 and 443; the workers run as nginx.

user nginx;
worker_processes auto;
# A lobby connection holds two descriptors, the client's and the gateway's: about 17 000 players a
# machine at 50 000 (architecture/01 §3) is 34 000, spread over the workers. The unit's LimitNOFILE
# matches.
worker_rlimit_nofile 65536;
pid /run/backend-nginx/nginx.pid;
error_log /var/log/backend-nginx/error.log warn;

events {
    worker_connections 16384;
}

http {
    include /opt/backend/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log /var/log/backend-nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    include /etc/backend/nginx/backend.conf;
}
