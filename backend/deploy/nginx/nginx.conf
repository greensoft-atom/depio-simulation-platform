# /etc/backend/nginx/nginx.conf - the main file of the release's nginx (/opt/backend/nginx, built for
# RHEL 9 by vendor/build-nginx.sh; docs/detailed-design/09 §5). The distribution's nginx brought
# its own; this one is ours. The server blocks are backend.conf and backend-stream.conf, beside it,
# with the site's addresses in backend-upstreams.conf and backend-stream.conf's map.
#
# Run by backend-nginx.service as root, which binds 443 and 9001; the workers run as nginx.

user nginx;
worker_processes auto;
# Every connection holds two descriptors, the client's and the upstream's, and the front's nginx
# holds every player's (D-82): a lobby connection and a match connection each, 200 000 at 50 000
# players (architecture/01 §3), spread over the workers. The unit's LimitNOFILE matches.
worker_rlimit_nofile 262144;
pid /run/backend-nginx/nginx.pid;
error_log /var/log/backend-nginx/error.log warn;

events {
    worker_connections 16384;
}

http {
    include /opt/backend/nginx/conf/mime.types;
    default_type application/octet-stream;
    # Which machine served each request, $upstream_addr, behind the front (D-82).
    log_format backend '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time '
                       '$upstream_addr "$http_user_agent"';
    access_log /var/log/backend-nginx/access.log backend;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    include /etc/backend/nginx/backend.conf;
}

# Match traffic on 9001, passed through to the arena its TLS handshake names (D-82).
stream {
    include /etc/backend/nginx/backend-stream.conf;
}
