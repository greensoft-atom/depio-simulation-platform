# j-redis-service - production configuration (Linux). See docs/11-operations-and-security.md.
# Format: one "directive value" per line; any directive can also be given on the command line
# as --directive value, which overrides this file.

port 6379
bind 127.0.0.1
# Set a long random secret (e.g. openssl rand -hex 32); clients pass it as password(...).
requirepass CHANGE-ME-TO-A-LONG-RANDOM-SECRET

dir /var/lib/j-redis
appendonly yes
appendfsync everysec
appendfsync-interval-millis 1000

# About 40 % of the heap (-Xmx8g in the systemd unit); see docs/06 section 6.
maxmemory 3gb

# Production stops go through systemd; nobody should empty or scan the keyspace by accident.
disable-command FLUSHALL
disable-command FLUSHDB
disable-command KEYS
disable-command SHUTDOWN
